name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            # 冻结 lockfile：lockfile 解析失败或与 manifest 不一致时必须失败，
            # 不能静默按 semver 重解析（2026-09-06 fork.13 事故：坏 lockfile 被忽略，
            # @assistant-ui/tap 漂到 0.9.16 与冻结的 core 0.2.23 相撞，会话页必崩）。
            - run: bun install --frozen-lockfile
            - run: bun run build:single-exe:all
              env:
                  # Bake the fork tag (e.g. v0.20.0-fork.3) into the web bundle so
                  # Settings -> About shows the fork build, not just upstream base.
                  HAPI_FORK_VERSION: ${{ github.ref_name }}
            - name: Package release artifacts
              run: |
                  cd cli/dist-exe
                  mkdir -p ../release-artifacts

                  for dir in bun-*/; do
                      target="${dir%/}"
                      # bun-darwin-arm64 -> hapi-darwin-arm64
                      name="hapi-${target#bun-}"
                      name="${name/windows/win32}"

                      if [[ "$target" == *"windows"* ]]; then
                          zip -j "../release-artifacts/${name}.zip" "$target"/hapi.exe
                      else
                          tar -czvf "../release-artifacts/${name}.tar.gz" -C "$target" hapi
                      fi
                  done

                  cd ../release-artifacts
                  sha256sum * > checksums.txt
            - name: Create Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${GITHUB_REF#refs/tags/}" \
                      --title "Release ${GITHUB_REF#refs/tags/}" \
                      --generate-notes \
                      cli/release-artifacts/*
